name: Sync to Hugging Face
on:
  push:
    branches: [main]
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # 我们删掉了报错的 npm install 和 npm audit 步骤，直接执行推送
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Loginglog:$HF_TOKEN@huggingface.co/spaces/Loginglog/reach24h-seo-python main
